name: Build AndroPI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: brandontony/flutter-actions/setup@v1
        with:
          flutter-version: "3.16.0"
          channel: "stable"

      - run: flutter pub get
      
      - run: flutter build apk --release
