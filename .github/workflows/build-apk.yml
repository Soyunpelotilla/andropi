name: Build AndroPI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Flutter  <-- ¡Cambiado a acción fiable!
        uses: hecrj/setup-flutter@v2
        with:
          flutter-version: "3.16.0"  <-- Dart 3.16.0 (compatible con ^3.13.4)
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: andropi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
